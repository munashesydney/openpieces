# =============================================================================
# Production — standalone Next.js build, no source mounts, restart policies
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Requirements:
#   - All env vars set in .env or injected by your platform
#   - Named volumes are provisioned automatically on first run
#
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_PORT: ${APP_PORT:-3141}
    ports:
      - "${APP_PORT:-3141}:${APP_PORT:-3141}"
    volumes:
      - pieces:/app/pieces
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENCODE_INTERNAL_URL=http://opencode:${OPENCODE_PORT:-4096}
      - SERVICE_HOST=http://worker
      - PORT=${APP_PORT:-3141}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - OPENPIECES_HUB_REDIRECT_URI=${NEXT_PUBLIC_APP_URL}/api/hub/callback
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - SERVICE_DOMAIN=${SERVICE_DOMAIN:-}
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.op-main.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.op-main.entrypoints=https"
      - "traefik.http.routers.op-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.op-wildcard.rule=HostRegexp(`^.+\\.${SERVICE_DOMAIN_REGEX_ESCAPED}$`)"
      - "traefik.http.routers.op-wildcard.entrypoints=https"
      - "traefik.http.routers.op-wildcard.tls.certresolver=letsencrypt"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-3141}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        APP_PORT: ${APP_PORT:-3141}
    env_file:
      - .env
    volumes:
      - pieces:/app/pieces
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - SERVICE_DOMAIN=${SERVICE_DOMAIN:-}
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command: serve --hostname 0.0.0.0 --port ${OPENCODE_PORT:-4096}
    working_dir: /pieces
    expose:
      - "${OPENCODE_PORT:-4096}"
    volumes:
      - pieces:/pieces
      - opencode_data:/root/.local/share/opencode
    environment:
      - OPENCODE_CONFIG_CONTENT={"permission":"allow"}
      - PORT=${OPENCODE_PORT:-4096}
      - HOSTNAME_OVERRIDE=0.0.0.0
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENPIECES_WEBHOOK_URL=http://app:${APP_PORT:-3141}/api/opencode/webhook
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
      - OPENCODE_ENABLE_EXA=1
    restart: always
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pieces:
  postgres_data:
  opencode_data:
