# =============================================================================
# Development — hot reload, verbose logs, source code mounted as a volume
#
# Start:
#   docker compose -f docker-compose.dev.yml up --build
#
# With your own hosted Postgres instead:
#   Remove the `db` service below and set DATABASE_URL in .env
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source so edits hot-reload inside the container
      - .:/app
      # Keep container's node_modules isolated from host (avoids cross-platform binary issues)
      - /app/node_modules
      # Keep Next.js build cache isolated
      - /app/.next
      # Shared pieces volume for OpenCode
      - ./pieces:/app/pieces
    # Run DB migrations then start dev server.
    entrypoint: ["entrypoint.sh"]
    command: sh -c "node_modules/.bin/tsx lib/db/migrate.ts && node_modules/.bin/next dev --webpack -p ${APP_PORT:-3141}"
    ports:
      - "${APP_PORT:-3141}:${APP_PORT:-3141}"
    environment:
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENCODE_INTERNAL_URL=http://opencode:${OPENCODE_PORT:-4096}
      - SERVICE_HOST=http://worker
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - PORT=${APP_PORT:-3141}
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
    env_file:
      - .env
    depends_on:
      opencode:
        condition: service_started
      db:
        condition: service_healthy
    # Pretty, coloured logs streamed directly to your terminal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./pieces:/app/pieces
    entrypoint: ["entrypoint.sh"]
    command: sh -c "node_modules/.bin/tsx scripts/ai-worker.ts"
    environment:
      - WATCHPACK_POLLING=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpieces}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpieces}
      POSTGRES_DB: ${POSTGRES_DB:-openpieces}
    ports:
      # Expose so you can connect with pgAdmin / psql from the host
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpieces} -d ${POSTGRES_DB:-openpieces}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command: serve --hostname 0.0.0.0
    working_dir: /pieces
    ports:
      - "4096:4096"
    volumes:
      - ./pieces:/pieces
      - ./opencode-data:/root/.local/share/opencode
    environment:
      - PORT=4096
      - HOSTNAME_OVERRIDE=0.0.0.0
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENPIECES_WEBHOOK_URL=http://app:${APP_PORT:-3141}/api/opencode/webhook
      - OPENPIECES_INTERNAL_URL=${OPENPIECES_INTERNAL_URL:-http://app:${APP_PORT:-3141}}
      - OPENCODE_ENABLE_EXA=1

volumes:
  postgres_data:
